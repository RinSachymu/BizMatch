- name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '18'

  - name: Install dependencies
    run: |
      cd app/frontend
      npm ci

  - name: Build
    run: |
      cd app/frontend
      npm run build

  - name: Upload artifact for deployment
    uses: actions/upload-pages-artifact@v1
    with:
      path: app/frontend/dist
